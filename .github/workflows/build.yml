name: Build and Release Rules

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  statuses: write
jobs:
  build:
    name: Build Rule Sets
    runs-on: ubuntu-latest

    steps:
      - name: Check tree reuse
        if: github.event_name == 'push'
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_CONTEXT: ci-tested-tree
        run: |
          set -uo pipefail
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          skip=false

          tree="$(gh api "repos/$repo/commits/$sha" --jq .commit.tree.sha)" || tree=""
          if [[ -z "$tree" ]]; then
            echo "::warning::读取 $sha 的 tree 失败，完整运行测试。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          heads="$(gh api "repos/$repo/commits/$sha/pulls" \
            --jq '.[] | select(.base.ref == "main" and .merged_at != null) | .head.sha')" || heads=""
          if [[ -z "$heads" ]]; then
            echo "该 commit 没有关联的已合并 PR（直接 push），完整运行测试。"
          fi

          for head in $heads; do
            recorded="$(gh api "repos/$repo/commits/$head/status?per_page=100" \
              --jq '[.statuses[] | select(.context == env.STATUS_CONTEXT and .state == "success")][0].description // empty')" || recorded=""
            recorded="${recorded#tree=}"
            if [[ -n "$recorded" && "$recorded" == "$tree" ]]; then
              skip=true
              echo "main 的 tree 与 PR head $head 已测内容一致，可跳过测试。"
              break
            fi
          done

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mihomo and sing-box
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.local/bin"
          ARCH="${{ runner.arch }}"
          if [ "$ARCH" = "ARM64" ]; then
            MIHOMO_SUB="linux-arm64"
            SINGBOX_SUB="linux-arm64"
          else
            MIHOMO_SUB="linux-amd64-compatible"
            SINGBOX_SUB="linux-amd64"
          fi

          echo "Downloading latest mihomo for ${MIHOMO_SUB}..."
          MIHOMO_URL=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq ".assets[] | select(.name | contains(\"${MIHOMO_SUB}\") and endswith(\".gz\")) | .browser_download_url" | head -n 1)
          curl -sSL "$MIHOMO_URL" | gzip -d > "$HOME/.local/bin/mihomo"
          chmod +x "$HOME/.local/bin/mihomo"

          echo "Downloading latest sing-box for ${SINGBOX_SUB}..."
          SINGBOX_URL=$(gh api repos/SagerNet/sing-box/releases/latest --jq ".assets[] | select(.name | contains(\"${SINGBOX_SUB}.tar.gz\")) | .browser_download_url" | head -n 1)
          TMP_SINGBOX=$(mktemp -d)
          curl -sSL "$SINGBOX_URL" | tar -xz -C "$TMP_SINGBOX" --strip-components=1
          cp "$TMP_SINGBOX/sing-box" "$HOME/.local/bin/sing-box"
          rm -rf "$TMP_SINGBOX"
          chmod +x "$HOME/.local/bin/sing-box"

          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build rule sets
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 scripts/build.py

      - name: Deploy to release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gate.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: release
          commit_message: "chore(release): update compiled rule-sets [skip ci]"

      - name: Record tested tree
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_CONTEXT: ci-tested-tree
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success \
            -f context="$STATUS_CONTEXT" \
            -f description="tree=$tree" \
            --jq '"recorded status id=\(.id) tree='"$tree"'"'
